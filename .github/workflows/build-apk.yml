name: Gerar APK Ponto Pro Gestao
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK com Suporte a Impressao Direta
        run: |
          npm install
          npm install -D @capacitor/assets
          mkdir -p assets
          cp public/pwa-icon-512.png assets/icon.png 2>/dev/null || cp public/icon.png assets/icon.png 2>/dev/null || echo "logo ok"
          npx cap add android || true
          npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" || true
          npm run build
          npx cap copy android

          # 1. Liberar comunicacao com app de impressao no AndroidManifest.xml (Android 11+)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "<queries>" "$MANIFEST"; then
            echo "queries já presente"
          else
            sed -i '/<\/manifest>/i \    <queries>\n        <package android:name="ru.a402d.rawbtprinter" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="rawbt" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

          # 2. Configurar MainActivity.java para liberar intent: e rawbt: na WebView
          MAIN_ACTIVITY="android/app/src/main/java/com/pontoprogestao/app/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.pontoprogestao.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  bridge.getWebView().setWebViewClient(new BridgeWebViewClient(bridge) {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("intent:") || url.startsWith("rawbt:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  view.getContext().startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  return true;
                              }
                          }
                          return super.shouldOverrideUrlLoading(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("intent:") || url.startsWith("rawbt:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  view.getContext().startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  e.printStackTrace();
                                  return true;
                              }
                          }
                          return super.shouldOverrideUrlLoading(view, url);
                      }
                  });
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: Ponto-Pro-Gestao-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
