name: Gerar APK Ponto Pro Gestao
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK com Logo Oficial
        run: |
          npm install
          npm install -D @capacitor/assets
          mkdir -p assets
          cp public/pwa-icon-512.png assets/icon.png 2>/dev/null || cp public/icon.png assets/icon.png 2>/dev/null || echo "logo ok"
          npx cap add android || true
          npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" || true
          npm run build
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: Ponto-Pro-Gestao-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
